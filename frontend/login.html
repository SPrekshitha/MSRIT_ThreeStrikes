<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🚀 Adaptive Productivity Hub</h1>

        <p>
            AI-powered task prioritization system
        </p>

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="login()">
            Login
        </button>

        <p class="switch-page">

            Don't have an account?

            <a href="signup.html">
                Signup
            </a>

        </p>

    </div>

</div>

<script>

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    try {

        const res = await fetch(
            "/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const data = await res.json();

        if (data.message === "Login successful") {

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            localStorage.setItem(
                "currentUser",
                email
            );

            alert("Login successful!");

            window.location.href =
                "index.html";

        } else {

            alert(data.message);
        }

    } catch (error) {

        console.log(error);

        alert("Login failed");
    }
}

</script>

</body>
</html>
