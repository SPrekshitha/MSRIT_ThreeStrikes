<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adaptive Productivity Hub</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🚀 Adaptive Productivity Hub</h1>
        <p>AI-powered task prioritization system</p>
    </header>

    <div class="card">
        <h2>Add Task</h2>

        <input type="text" id="taskName" placeholder="Task name">
        <input type="date" id="deadline">

        <select id="priority">
            <option value="1">Low Priority</option>
            <option value="2">Medium Priority</option>
            <option value="3">High Priority</option>
        </select>

        <button class="primary" onclick="addTask()">➕ Add Task</button>
    </div>

    <div class="card">
        <button class="primary" onclick="prioritizeTasks()">⚡ Run AI Prioritization</button>
        <button class="danger" onclick="clearTasks()">🗑 Clear All Tasks</button>
    </div>

    <div class="card">
        <h2>📋 Tasks</h2>
        <div id="taskContainer"></div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
