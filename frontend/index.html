<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adaptive Productivity Hub</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🚀 Adaptive Productivity Hub</h1>
        <p>AI-powered task prioritization system</p>
    </header>

    <div class="card">
        <h2>Add Task</h2>

        <label>Task Name</label>

        <input
            type="text"
            id="taskName"
            placeholder="Example: Finish hackathon presentation"
        >

        <label>Deadline</label>

        <input
            type="date"
            id="deadline"
        >
        

        <label>Task Importance</label>

        <select id="priority">

        <option value="1">
            Low Priority — Can be done later
        </option>

        <option value="2">
            Medium Priority — Important but not urgent
        </option>

        <option value="3">
            High Priority — Urgent and important
        </option>

        </select>


        <button class="primary" onclick="addTask()">➕ Add Task</button>

    </div>

    <div class="card">
        <button class="primary" onclick="prioritizeTasks()">⚡ Run AI Prioritization</button>
        <button class="danger" onclick="clearTasks()">🗑 Clear All Tasks</button>
    </div>

    <div class="card">
        <h2>📋 Tasks</h2>
        <div id="taskContainer"></div>
    </div>
    <div class="card">

    <h2>🤖 AI Productivity Assistant</h2>

    <p class="helper-text">
        Enter your current workload and select your mood
        to receive personalized AI productivity advice.
    </p>

    <textarea
        id="tasksInput"
        placeholder="Example:
    - Complete assignment
    - Prepare presentation
    - Study for exam">
    </textarea>

    <select id="moodInput">

    <option value="Focused">
        Focused — Ready for deep work
    </option>

    <option value="Stressed">
        Stressed — Feeling overloaded
    </option>

    <option value="Tired">
        Tired — Low energy today
    </option>

    <option value="Overwhelmed">
        Overwhelmed — Too many tasks
    </option>

</select>

    <button
        id="aiButton"
        class="primary"
        onclick="generateAIAdvice()">

        ✨ Generate AI Advice

    </button>

    <div id="ai-response"></div>

</div>

</div>
<script src="script.js"></script>
</body>
</html>
